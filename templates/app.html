{% extends "base.html" %}

{% block header_actions %}
<div class="top-actions">
  <a href="/profile" class="profile-chip" id="profile-chip" aria-label="Open profile">
    <span class="profile-avatar" id="profile-avatar">?</span>
    <span class="profile-meta">
      <span class="profile-name" id="profile-name">Profile</span>
      <span class="profile-hint">View &amp; edit</span>
    </span>
  </a>
  <button type="button" id="logout-btn" class="btn ghost">Log out</button>
</div>
{% endblock %}

{% block content %}
<section class="app-panel">
  <h1 class="display">TodoDesk</h1>
  <p class="lede">Capture what matters. Finish it.</p>

  <form id="todo-form" class="todo-compose" novalidate>
    <input
      id="todo-title"
      name="title"
      placeholder="Add a todo…"
      maxlength="255"
      required
      autocomplete="off"
    />
    <button type="submit" class="btn primary">Add</button>
  </form>
  <p id="todo-error" class="error" hidden></p>

  <ul id="todo-list" class="todo-list" aria-live="polite"></ul>
  <p id="todo-empty" class="muted empty" hidden>No todos yet. Add one above.</p>
</section>
{% endblock %}

{% block scripts %}
<script src="/static/js/todos.js?v=3"></script>
<script>
  TodoApp.init();
</script>
{% endblock %}
